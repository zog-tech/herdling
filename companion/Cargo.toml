[package]
name = "zogsshd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zogsshd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[lib]
name = "zogsshd"
path = "src/lib.rs"
