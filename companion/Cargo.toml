[package]
name = "zogsshd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zogsshd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
dirs = "6"
toml = "0.8"
fs4 = { version = "0.13", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
axum = "0.8"

[lib]
name = "zogsshd"
path = "src/lib.rs"
