[package]
name = "herdlingd"
version = "0.1.6"
edition = "2021"
license = "MPL-2.0"

[[bin]]
name = "herdlingd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
dirs = "6"
toml = "0.8"
fs4 = { version = "0.13", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
rand = "0.9"
sha2 = "0.10"
# CPace (PAKE) for pairing: ristretto255 and HMAC-SHA-512. See src/cpace.rs.
curve25519-dalek = "=4.1.3"
hmac = "=0.12.1"
base64 = "0.22"
# Ed25519 check of the release manifest. ring is already in the tree through rustls.
ring = "0.17"
qrcode = { version = "0.14", default-features = false }
if-addrs = "0.13"
mdns-sd = "0.13"
libc = "0.2"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "herdlingd"
path = "src/lib.rs"
