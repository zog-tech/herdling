plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.zogtech.herdling'
version = '1.0.0'

android {
  namespace "com.zogtech.herdling.ssh"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'consumer-rules.pro'
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  // sshj: SSH client with ed25519 keys and host keys through BouncyCastle.
  // expo-updates uses the jdk15to18 build of BouncyCastle; two builds in one app clash, so
  // sshj gets the same build here in place of its jdk18on one.
  implementation('com.hierynomus:sshj:0.41.2') {
    exclude group: 'org.bouncycastle'
  }
  implementation 'org.bouncycastle:bcprov-jdk15to18:1.84'
  implementation 'org.bouncycastle:bcpkix-jdk15to18:1.84'
  // sshj logs through slf4j. This drops the log lines and the "no provider" warning.
  implementation 'org.slf4j:slf4j-nop:2.0.17'

  testImplementation 'junit:junit:4.13.2'
}
